# RudeAuth example configuration.
#
# Copy to rudeauth.ini and fill in from the dashboard:
#   Applications -> Application credentials
#
# Both values below are safe to share. The public key verifies responses and
# cannot forge them, and the application ID identifies rather than authorises.
#
# THIS FILE IS FOR EVALUATION, NOT FOR SHIPPING.
#
# A real client compiles both values in. Left in a file, the public key can be
# swapped for an attacker's, the base URL pointed at a server they run, and
# every signature check will then pass against forged replies. Embedding it is
# what makes the check mean anything.

RUDEAUTH_APP_ID=
RUDEAUTH_PUBLIC_KEY=

# Your own deployment, or https://api.rudeauth.com once hosted.
RUDEAUTH_BASE_URL=http://127.0.0.1:8099
